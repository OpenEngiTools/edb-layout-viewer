[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "edb-viewer-adapter"
version = "0.1.0"
description = "EDB integration for the layout viewer."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenEngiTools"}]
dependencies = [
    "pyedb",
    "layout-viewer-core>=0.1.0",
    "ansys-edb-core>=0.3.3",
]

[project.scripts]
edb-layout-viewer = "edb_layout_viewer.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.flit.module]
name = "edb_layout_viewer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.uv.sources]
layout-viewer-core = { path = "../layout_viewer_core", editable = true }
