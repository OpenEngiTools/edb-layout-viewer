[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "edb-viewer-adapter"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenEngiTools"}]
dependencies = ["pyedb", "layout-viewer", "ansys-edb-core>=0.3.3"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.flit.module]
name = "viewer_adapter"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
