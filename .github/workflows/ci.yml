name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux graphics build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install layout-viewer-core
        run: python -m pip install "layout-viewer-core @ git+https://github.com/OpenEngiTools/layout-viewer-core.git"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check lint and formatting
        run: |
          python -m ruff check
          python -m ruff format --check
      - name: Build distributions
        run: python -m build
